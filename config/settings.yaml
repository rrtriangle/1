# market-research-lab 설정
# 경로는 프로젝트 루트 기준 상대경로 또는 절대경로.
# 환경변수 MARKETLAB_DATA_DIR 이 지정되면 data_dir 보다 우선한다.

paths:
  data_dir: data          # 외장 SSD 사용 시 예: /Volumes/MarketSSD/market-research-lab-data
  logs_dir: logs
  reports_dir: reports
  models_dir: models

storage:
  project_budget_gb: 30          # 초기 추가 디스크 사용 예산
  min_free_gb: 20                # 내장 SSD 최소 여유 공간
  assumed_free_gb_baseline: 60   # 이 값보다 실제 여유가 작으면 예산을 자동 축소
  growth_alert_factor: 1.5       # 작업 중 사용량이 예상의 1.5배를 넘으면 위험 판정
  require_mounted_volume: true   # data_dir 이 /Volumes 아래이면 마운트·쓰기 가능 여부를 매번 확인

duckdb:
  memory_limit: 2GB
  threads: 2
  preserve_insertion_order: false
  max_temp_directory_size: 4GB

http:
  user_agent: "market-research-lab/0.1 (+https://github.com/rrtriangle/1)"
  timeout_sec: 60
  max_retries: 5
  backoff_base_sec: 2.0
  backoff_max_sec: 120.0
  # 연속 차단(403/429) 횟수가 이 값을 넘으면 해당 원천 수집을 안전하게 중단
  circuit_breaker_threshold: 8

sources:
  marcap:
    enabled: true
    repo: FinanceData/marcap
    branch: master
    raw_base: https://raw.githubusercontent.com/FinanceData/marcap
    api_base: https://api.github.com
    min_interval_sec: 0.5
  krx_cache:
    enabled: true
    repo: FinanceData/fdr_krx_data_cache
    branch: master
    raw_base: https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache
    min_interval_sec: 0.5
    indices: [ks11, kq11, ks200, krx_index_1001]
  nasdaqtrader:
    enabled: true
    urls:
      nasdaqlisted: https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt
      otherlisted: https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt
    min_interval_sec: 1.0
    include_test_issues: false   # 거래소 테스트 종목(ZVZZT 등) 제외
  yfinance:
    enabled: true
    min_interval_sec: 1.2        # 종목당 요청 간격 (Yahoo 비공식 API, 보수적으로)
    batch_size: 200              # 이 개수마다 Parquet 파트 파일로 기록

    # 상품 유형 필터 (수집은 전부, 연구 시 필터링). 수집 제외하려면 여기서 제거
    security_types: [common, etf, adr, reit, preferred, spac, unit, warrant, right, note, other]
  stooq:
    enabled: true
    csv_url: https://stooq.com/q/d/l/?s={symbol}&i=d
    min_interval_sec: 2.0
  fred:
    enabled: true
    csv_url: https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}
    min_interval_sec: 1.0
    series: [DGS3MO, DGS2, DGS10, DGS30, T10Y2Y, T10Y3M, DEXKOUS, VIXCLS, SP500, NASDAQCOM, DJIA, BAMLH0A0HYM2, DFF]
  yahoo_indices:
    enabled: true
    symbols:
      "^GSPC": {name: S&P 500, currency: USD, market: US}
      "^IXIC": {name: NASDAQ Composite, currency: USD, market: US}
      "^DJI": {name: Dow Jones Industrial Average, currency: USD, market: US}
      "^VIX": {name: CBOE VIX, currency: USD, market: US}
      "^TNX": {name: US 10Y Treasury Yield x10, currency: USD, market: US}
      "^KS11": {name: KOSPI, currency: KRW, market: KR}
      "^KQ11": {name: KOSDAQ, currency: KRW, market: KR}
      "KRW=X": {name: USD/KRW, currency: KRW, market: FX}
      "TLT": {name: iShares 20+Y Treasury ETF, currency: USD, market: US}
      "GLD": {name: SPDR Gold ETF, currency: USD, market: US}
  sec:
    enabled: true
    tickers_url: https://www.sec.gov/files/company_tickers_exchange.json
    submissions_zip: https://www.sec.gov/Archives/edgar/daily-index/bulkdata/submissions.zip
    companyfacts_zip: https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip
    min_interval_sec: 0.15       # SEC 공식 한도 10 req/s 보다 낮게
  opendart:
    enabled: true
    corpcode_url: https://opendart.fss.or.kr/api/corpCode.xml

update:
  recheck_recent_trading_days: 5   # 증분 갱신 시 최근 N 거래일 재검증
  revalidate_every_days: 30        # 과거 데이터 주기적 재검증 간격
  # 일봉 확정 판단: 거래소 마감 후 대기 시간
  finalize_after:
    KR: {tz: Asia/Seoul, close: "15:30", delay_min: 180}
    US: {tz: America/New_York, close: "16:00", delay_min: 240}

schedule:
  # launchd 자동 갱신 시각 (로컬 시각). 사용자 수정 가능.
  times: ["07:30", "19:30"]
  label: com.marketlab.update

validation:
  big_move_threshold: 0.35      # 일간 |수익률| 이 이를 넘으면 기업행위 대조 대상
  stale_days_warn: 7
  cross_source_tolerance: 0.005 # 원천 간 종가 차이 허용 비율
